name: TCGPlayer Sealed Price Guide

on:
  schedule:
    - cron: '0 2 * * *'   # codziennie 02:00 UTC (zmień wedle potrzeb)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies (requests option)
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Ensure output folder exists
        run: mkdir -p tcg-sealed-price-guide

      - name: Run scraper (scripts/scrape_tcg.py)
        env:
          BASE_PATTERN: 'https://www.tcgplayer.com/search/pokemon/product?productLineName=pokemon&page={page}&view=grid&ProductTypeName=Sealed+Products'
          START_PAGE: '1'
          MAX_PAGES: '200'
          OUT_DIR: 'tcg-sealed-price-guide'
        run: |
          python scripts/scrape_tcg.py "$BASE_PATTERN" "$START_PAGE" "$MAX_PAGES" "$OUT_DIR"

      - name: Commit and push results (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tcg-sealed-price-guide || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update TCG sealed price guide: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
