name: TCGdex Daily Sync

on:
  schedule:
    # GitHub Actions uses UTC for cron. 10:00 Europe/Warsaw (CET/UTC+1 in winter) = 09:00 UTC
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch base card list
        run: node scripts/fetch-baza.js

      - name: Build western.json and save dated EN file
        run: node scripts/build-western.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add baza.json western.json
          git add EN || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily TCGdex sync"
            git push
          fi
