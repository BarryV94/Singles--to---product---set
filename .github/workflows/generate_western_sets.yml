name: Generate western_sets.json

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run generator script
        run: |
          node ./scripts/generate_western_sets.js

      - name: Commit generated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add suggestions/mapping files if created
          git add .github/expansion-mapping.suggestions.json || true
          git add .github/expansion-mapping.sample.json || true

          # Add western_sets.json in repo root (if created)
          git add western_sets.json || true

          # Add any other western_sets.json files found anywhere in the repo (created next to products file)
          git add $(git ls-files --others --exclude-standard -om | grep -E 'western_sets\.json$' || true) || true

          # Stage any existing changed generated files that match common names (safe no-op if not present)
          git add ./western_sets.json ./Singles--to---product---set/western_sets.json || true

          if ! git diff --staged --quiet; then
            git commit -m "chore: regenerate western_sets.json (TCGdex suggestions + mapping)"
            git push
          else
            echo "No changes to commit."
          fi
