name: Generate western_sets.json


on:
workflow_dispatch: {}
push:
branches:
- main


jobs:
build:
runs-on: ubuntu-latest


steps:
- name: Check out repo
uses: actions/checkout@v4
with:
persist-credentials: true


- name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: '20'


- name: Run generator script
run: |
node ./scripts/generate_western_sets.js


- name: Commit generated file (if changed)
run: |
git config user.name "github-actions[bot]"
git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
git add PKMNTCGSets-main/western_sets.json || true
if ! git diff --staged --quiet; then
git commit -m "chore: regenerate western_sets.json (TCGdex)"
git push
else
echo "No changes to commit"
fi
