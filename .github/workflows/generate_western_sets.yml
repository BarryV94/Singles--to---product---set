name: Generate western_sets.json

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write    # ważne: pozwala na push przy użyciu GITHUB_TOKEN

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run generator script
        run: |
          node ./scripts/generate_western_sets.js

      - name: Commit & push generated files (if changed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all changes (only generated files should be new/changed)
          git add -A

          # If there's nothing staged, exit cleanly
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: regenerate western_sets.json (TCGdex suggestions + mapping)"

          # Push using the GITHUB_TOKEN in the remote URL to ensure auth
          # Push to the same branch that triggered the workflow (usually 'main')
          branch="${GITHUB_REF##*/}"
          echo "Pushing to branch: $branch"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:$branch"
